{% extends "base.html" %}
{% block title %}Passwort vergessen – MCConnect{% endblock %}
{% block content %}
<h1>Passwort vergessen</h1>
<p class="lead">Wir schicken dir einen Link, mit dem du ein neues Passwort setzen kannst.</p>
<form class="card" id="request-form" style="max-width: 520px">
  <label for="email">E-Mail-Adresse deines Accounts</label>
  <input id="email" type="email" autocomplete="email" required />
  <div class="btn-row">
    <button class="btn" type="submit">Link anfordern</button>
    <a class="btn btn-secondary" href="/login">Zurück zum Login</a>
  </div>
  <div class="message" id="request-message"></div>
</form>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce() }}">
  document.getElementById("request-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    await postJson("/api/password_reset/request", { email: document.getElementById("email").value });
    showMessage(document.getElementById("request-message"),
                "Falls zu dieser Adresse ein Account gehört, ist eine E-Mail mit einem Link unterwegs (1 Stunde gültig). Schau auch im Spam-Ordner nach.",
                "success");
  });
</script>
{% endblock %}
