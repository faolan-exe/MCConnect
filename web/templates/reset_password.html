{% extends "base.html" %}
{% block title %}Neues Passwort – MCConnect{% endblock %}
{% block content %}
<h1>Neues Passwort</h1>
<p class="lead">Für den Account <strong>{{ username }}</strong>.</p>
<form class="card" id="reset-form" style="max-width: 520px">
  <label for="password">Neues Passwort <span class="hint">(mindestens 8 Zeichen)</span></label>
  <input id="password" type="password" autocomplete="new-password" minlength="8" required />
  <label for="password2">Passwort wiederholen</label>
  <input id="password2" type="password" autocomplete="new-password" minlength="8" required />
  <div class="btn-row"><button class="btn" type="submit">Passwort speichern</button></div>
  <div class="message" id="reset-message"></div>
</form>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce() }}">
  const TOKEN = {{ token | tojson }};
  document.getElementById("reset-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("reset-message");
    const password = document.getElementById("password").value;
    if (password !== document.getElementById("password2").value) {
      showMessage(message, "Die Passwörter stimmen nicht überein.", "error");
      return;
    }
    const result = await postJson("/api/password_reset/confirm", { token: TOKEN, password: password });
    if (result.ok) {
      event.target.querySelector("button").disabled = true;
      showMessage(message, "Passwort geändert. Du wirst zum Login weitergeleitet …", "success");
      setTimeout(() => (window.location.href = "/login"), 2000);
    } else {
      showMessage(message, result.data.error || "Das hat nicht geklappt.", "error");
    }
  });
</script>
{% endblock %}
