{% extends "base.html" %}
{% block title %}Login – MCConnect{% endblock %}
{% block content %}
<h1>Login für Server-Admins</h1>
<p class="lead">Melde dich an, um deine Server zu verwalten, oder erstelle einen neuen Account.</p>
<div class="grid-2">
  <form class="card" id="login-form">
    <h2>Einloggen</h2>
    <label for="usernameL">Benutzername</label>
    <input id="usernameL" autocomplete="username" required />
    <label for="passwordL">Passwort</label>
    <input id="passwordL" type="password" autocomplete="current-password" required />
    <div class="btn-row"><button class="btn" type="submit">Einloggen</button></div>
    <div class="message" id="login-message"></div>
  </form>

  <form class="card" id="signup-form">
    <h2>Registrieren</h2>
    <label for="usernameS">Benutzername <span class="hint">(3–32 Zeichen)</span></label>
    <input id="usernameS" autocomplete="username" required />
    <label for="email">E-Mail</label>
    <input id="email" type="email" autocomplete="email" required />
    <label for="passwordS">Passwort <span class="hint">(mindestens 8 Zeichen)</span></label>
    <input id="passwordS" type="password" autocomplete="new-password" required />
    <label for="password2">Passwort wiederholen</label>
    <input id="password2" type="password" autocomplete="new-password" required />
    <div class="btn-row"><button class="btn" type="submit">Account erstellen</button></div>
    <div class="message" id="signup-message"></div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("login-message");
    const result = await postJson("/api/login", {
      username: document.getElementById("usernameL").value,
      password: document.getElementById("passwordL").value,
    });
    if (result.ok) {
      window.location.href = "/manage";
    } else {
      showMessage(message, "Login fehlgeschlagen. Prüfe Benutzername und Passwort und ob du deine E-Mail-Adresse bestätigt hast.", "error");
    }
  });

  document.getElementById("signup-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("signup-message");
    const password = document.getElementById("passwordS").value;
    if (password !== document.getElementById("password2").value) {
      showMessage(message, "Die Passwörter stimmen nicht überein.", "error");
      return;
    }
    const result = await postJson("/api/signup", {
      username: document.getElementById("usernameS").value,
      email: document.getElementById("email").value,
      password: password,
    });
    if (result.ok) {
      event.target.reset();
      showMessage(message, "Account erstellt! Wir haben dir eine E-Mail geschickt – bestätige deine Adresse und logge dich dann ein.", "success");
    } else {
      showMessage(message, result.data.error || "Der Account konnte nicht erstellt werden.", "error");
    }
  });
</script>
{% endblock %}
