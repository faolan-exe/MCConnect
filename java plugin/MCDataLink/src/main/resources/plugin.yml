name: MCDataLink
version: '${project.version}'
main: org.tobias.mcdatalink.MCDataLink
api-version: '1.13'
authors: [Tobias Auer]
description: Connects the server to MCConnect and provides the in-game stats
website: mc.tobisit.de
commands:
  stats:
    description: Statistik von dir oder einem anderen Spieler
    usage: /stats [spieler]
  top:
    description: Die Besten einer Kennzahl
    usage: /top <kennzahl> [7|30]
  wettbewerb:
    description: Laufende Wettbewerbe und Gemeinschaftsziele
    usage: /wettbewerb
  duell:
    description: Andere zum Duell herausfordern
    usage: /duell [<spieler> <kennzahl> [tage]|annehmen|ablehnen]
  report:
    description: Etwas an die Moderatoren melden
    usage: /report <spieler oder -> <was ist passiert>
  seitenleiste:
    description: Seitenleiste mit Wettbewerb oder Spielzeit ein- und ausschalten
    usage: /seitenleiste [aus|wettbewerb|spielzeit]
    aliases: [sidebar]
  vote:
    description: Bei Umfragen abstimmen
    usage: /vote [<umfrage> <antwort>]
  events:
    description: Nächste Events anzeigen und sich anmelden
    usage: /events [anmelden|abmelden <nr>]
  verwarnen:
    description: Einen Spieler verwarnen (nur Moderatoren)
    usage: /verwarnen <spieler> <grund>
  stumm:
    description: Einen Spieler stummschalten (nur Moderatoren)
    usage: /stumm <spieler> <minuten> [grund]
  entstummen:
    description: Stummschaltung aufheben (nur Moderatoren)
    usage: /entstummen <spieler>
  joinmessage:
    description: Deine Join- und Leave-Nachricht gestalten
    usage: /joinmessage [text|leave|farbe|symbol|stil|sound|aus] [wert]
