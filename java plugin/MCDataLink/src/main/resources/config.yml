# MCDataLink - connects this server to MCConnect.
# Your server key is shown when you create the server on the MCConnect website.
key: <enter key here>

# Address of the MCConnect socket server. Only change this if you host MCConnect yourself.
host: mc.tobisit.de
port: 9991
# The connection is always encrypted (TLS). Only for a self-hosted MCConnect with a self-signed certificate:
# its SHA-256 fingerprint (the socket server logs it), e.g. "AB:CD:...". Leave empty for mc.tobisit.de.
tls-fingerprint: ""

# Where prefixes from the website are shown. Switch a place off if another plugin
# (e.g. TAB or a chat plugin) already manages it.
prefix:
  chat: true
  tablist: true
  nametag: true

# Send the stats of online players while they play (read live from the game), so achievements, rankings,
# competitions and the sidebar follow within seconds instead of waiting for the next world save.
live-stats: true
# Seconds between two updates (only what changed is read; the blocks are sent completely once a minute).
live-stats-interval: 5
