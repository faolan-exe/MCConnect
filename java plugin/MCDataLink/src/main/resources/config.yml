# MCDataLink - connects this server to MCConnect.
# Your server key is shown when you create the server on the MCConnect website.
key: <enter key here>

# Address of the MCConnect socket server. Only change this if you host MCConnect yourself.
host: mc.tobisit.de
port: 9991
# The connection is always encrypted (TLS). The plugin trusts exactly the certificate with this SHA-256
# fingerprint; copy the config from the MCConnect admin page, it contains the line. Empty: the certificate
# is checked like HTTPS (only for an MCConnect with a certificate from a certificate authority).
tls-fingerprint: ""

# Where prefixes from the website are shown. Switch a place off if another plugin
# (e.g. TAB or a chat plugin) already manages it.
prefix:
  chat: true
  tablist: true
  nametag: true

# Send the stats of online players while they play (read live from the game), so achievements, rankings,
# competitions and the sidebar follow within seconds instead of waiting for the next world save.
live-stats: true
# Seconds between two updates (only what changed is read; the blocks are sent completely once a minute).
live-stats-interval: 5

# Offer the MCConnect resource pack (icons for join messages and the line under the names) when players join.
# It is optional for the players; whoever declines it sees simple symbols instead. On 1.20.3+ it is loaded next
# to the server's own pack; on older servers it replaces the pack from server.properties, so switch it off there.
resource-pack: true

# The line under the player names (trophies, streak, level, ...; every player picks on the website). Needs Paper
# 1.20.3 or newer. Players with the resource pack use a copy of the main scoreboard with MCConnect's name tag
# teams; switch this off if another plugin manages the scoreboard.
name-badges: true
